name: Build DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Compile DLL
      run: |
        cl.exe /LD /EHsc spoof_core.cpp anti_ban.cpp /Fe:spoof_core.dll user32.lib iphlpapi.lib

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: spoof_core_dll
        path: spoof_core.dll
